<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Showcase</title>
  <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/hud.css" />
    <script>
      try {
        var t = localStorage.getItem('showcase-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
</head>

<body>
  <div id="app"></div>

    <!-- Control panel -->
  <aside id="ui-overlay" aria-label="Viewer controls">
    <header class="panel-header">
      <h1 class="panel-title">3D Showcase</h1>
      <button id="toggle-ui" class="panel-collapse" type="button" aria-label="Collapse panel" title="Collapse panel">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
    </header>

    <div id="ui-content">
      <section class="panel-section">
        <h2 class="section-label">Model</h2>
        <div class="model-tabs" role="list">
          <button class="tab-btn active" data-mode="paris"><span>Eiffel Tower</span></button>
          <button class="tab-btn" data-mode="sagrada"><span>Sagrada Família</span></button>
          <button class="tab-btn" data-mode="jet"><span>MiG-23</span></button>
          <button class="tab-btn" data-mode="car"><span>Race Car</span></button>
          <button class="tab-btn" data-mode="fan"><span>Retro Desk Fan</span></button>
          <button class="tab-btn" data-mode="chair"><span>Armchair</span></button>
          <button class="tab-btn" data-mode="coin"><span>Coin</span></button>
          <button class="tab-btn" data-mode="tnt"><span>TNT</span></button>
          <button class="tab-btn" data-mode="showcase"><span>Game scene</span></button>
        </div>
      </section>

      <section id="jet-view-bar" class="panel-section view-bar">
        <h2 class="section-label">Camera</h2>
        <div class="view-buttons">
          <button class="view-btn" data-view="photo">Photo View</button>
          <button class="view-btn" data-view="trocadero">Trocadéro View</button>
          <button class="view-btn" data-view="trocadero_pov">Trocadéro POV</button>
          <button class="view-btn" data-view="under">Under Tower</button>
          <button class="view-btn" data-view="aerial">Aerial</button>
          <button class="view-btn" data-view="champ">Champ de Mars</button>
          <button class="view-btn active" data-view="tower">Eiffel Tower</button>
          <button class="view-btn" data-view="spire">Spire</button>
          <button class="view-btn" data-view="boat">River &amp; Boat</button>
          <button class="view-btn" data-view="top">Top View</button>
        </div>
      </section>

      <section class="panel-section">
        <h2 class="section-label">Display</h2>
        <button id="btn-toggle-rotate" class="option-row" type="button" role="switch" aria-checked="false">
          <span class="option-name">Auto rotate</span>
          <span class="switch" aria-hidden="true"></span>
          <span id="rotate-status" class="sr-only">OFF</span>
        </button>
        <div class="option-row">
          <span class="option-name" id="theme-label">Theme</span>
          <div class="segmented" role="group" aria-labelledby="theme-label">
            <button type="button" class="seg-btn" data-theme-value="light">Light</button>
            <button type="button" class="seg-btn" data-theme-value="dark">Dark</button>
          </div>
        </div>
        <button id="btn-open-refs" class="text-btn" type="button">View reference images</button>
      </section>

      <section class="panel-section export-bar">
        <h2 class="section-label">Download (.glb)</h2>
        <div class="export-links">
          <a class="export-btn" href="./models/paris.glb" download="paris.glb">paris</a>
          <a class="export-btn" href="./models/sagrada.glb" download="sagrada.glb">sagrada</a>
          <a class="export-btn" href="./models/jet.glb" download="jet.glb">jet</a>
          <a class="export-btn" href="./models/car.glb" download="car.glb">car</a>
          <a class="export-btn" href="./models/fan.glb" download="fan.glb">fan</a>
          <a class="export-btn" href="./models/coin.glb" download="coin.glb">coin</a>
          <a class="export-btn" href="./models/tnt.glb" download="tnt.glb">tnt</a>
          <a class="export-btn" href="./models/road.glb" download="road.glb">road</a>
        </div>
      </section>
    </div>
  </aside>

  <!-- 3D World Anchored Hover Tooltip -->
  <div id="tnt-world-tooltip" class="tnt-world-tooltip hidden">
    <div class="tnt-tooltip-pill">
      <span class="tnt-tooltip-pulse"></span>
      <span class="tnt-tooltip-text">Click to Detonate</span>
    </div>
    <div class="tnt-tooltip-stem"></div>
  </div>

  <!-- Reference Photos Modal (no badges, no summary, no emojis) -->
  <div id="ref-modal" class="ref-modal hidden" aria-hidden="true" role="dialog" aria-labelledby="ref-modal-title">
    <div class="ref-modal-backdrop" id="ref-modal-backdrop"></div>
    <div class="ref-modal-dialog">
      <div class="ref-modal-header">
        <div class="ref-modal-header-info">
          <h2 id="ref-modal-title">Reference Photos: Paris (Eiffel Tower)</h2>
        </div>
        <button id="ref-modal-close" class="ref-modal-close-btn" aria-label="Close reference gallery"
          title="Close (Esc)">✕</button>
      </div>

      <!-- Modal Model Tabs (no emojis) -->
      <div class="ref-model-nav" id="ref-model-nav">
        <button class="ref-nav-btn active" data-model="paris">Eiffel Tower</button>
        <button class="ref-nav-btn" data-model="sagrada">Sagrada Família</button>
        <button class="ref-nav-btn" data-model="jet">MiG-23 Fighter Jet</button>
        <button class="ref-nav-btn" data-model="fan">Retro Desk Fan</button>
        <button class="ref-nav-btn" data-model="chair">Red Armchair</button>
      </div>

      <div class="ref-modal-content">
        <!-- Sidebar: Reference Cards List -->
        <div class="ref-sidebar" id="ref-sidebar"></div>

        <!-- Preview Area -->
        <div class="ref-preview-area">
          <div class="ref-preview-image-container">
            <img id="ref-preview-img" src="" alt="Reference Preview" />
          </div>
          <div class="ref-preview-details">
            <div class="ref-preview-details-top">
              <div class="ref-preview-headings">
                <h3 id="ref-preview-title">1</h3>
              </div>
              <a id="ref-preview-open-full" href="#" target="_blank" rel="noopener noreferrer"
                class="ref-btn-open-full">
                ↗ Open Full Resolution
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
